services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
    volumes:
      - pgdata:/var/lib/postgresql/data
  app1:
    build: ./app
    hostname: app1
    environment:
      DB_HOST: db
    depends_on:
      - db
  app2:
    build: ./app
    hostname: app2
    environment:
      DB_HOST: db
    depends_on:
      - db
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
volumes:
  pgdata:
